*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#0a0e1a;color:#fff;min-height:100vh;padding-bottom:90px}
.header{background:#111827;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1f2937}
.header h1{font-size:16px;letter-spacing:1px}
.balance-card{margin:16px;background:linear-gradient(135deg,#0098EA 0%,#0066cc 100%);border-radius:20px;padding:20px;position:relative;overflow:hidden}
.balance-card::after{content:"";position:absolute;right:-20px;top:-20px;width:120px;height:120px;background:rgba(255,255,255,0.1);border-radius:50%}
.badge{background:rgba(0,0,0,0.2);display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;margin-bottom:10px}
.amount{font-size:36px;font-weight:700;display:flex;align-items:center;gap:8px}
.amount span{font-size:16px;opacity:0.8;font-weight:400}
.stats{margin:0 16px;background:#151a28;border-radius:14px;display:flex;padding:14px 0;border:1px solid #1f2937}
.stat{flex:1;text-align:center;border-right:1px solid #1f2937}
.stat:last-child{border:none}
.stat b{display:block;font-size:18px;color:#0098EA}
.stat p{font-size:11px;opacity:0.6;margin-top:2px}
.actions{margin:16px;display:flex;gap:12px}
.btn{flex:1;padding:14px;border-radius:12px;border:none;font-weight:600;cursor:pointer;font-size:14px}
.btn-primary{background:#0098EA;color:#fff}
.btn-dark{background:#1f2937;color:#fff;border:1px solid #2d3748}
.card{margin:12px 16px;background:#151a28;border-radius:16px;padding:16px;display:flex;justify-content:space-between;align-items:center;border:1px solid #1f2937}
.card-left{display:flex;gap:12px;align-items:center}
.icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.icon-orange{background:#ff8c00} .icon-blue{background:#0098EA} .icon-green{background:#10b981}
.card h3{font-size:14px} .card p{font-size:12px;color:#10b981;margin-top:2px}
.card small{font-size:11px;opacity:0.5}
.open-btn{background:#0098EA;color:#fff;border:none;padding:8px 18px;border-radius:20px;font-weight:600;cursor:pointer}
.section-title{margin:20px 16px 8px;font-size:12px;opacity:0.6;letter-spacing:1px;display:flex;justify-content:space-between}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:#111827;border-top:1px solid #1f2937;display:flex;padding:8px 0}
.tab{flex:1;text-align:center;padding:8px;font-size:11px;opacity:0.5;cursor:pointer}
.tab.active{opacity:1;color:#0098EA}
.tab b{font-size:20px;display:block}
.page{display:none} .page.active{display:block}
.ref-card{margin:16px;background:linear-gradient(135deg,#0098EA,#0055a5);border-radius:20px;padding:20px;text-align:left}
.ref-card h2{font-size:20px;margin-bottom:6px}

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ton Miner</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://sad.adsgram.ai/js/sad.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#070d1c;color:#fff;font-family:system-ui,sans-serif;padding-bottom:85px}
    .top{display:flex;justify-content:space-between;padding:12px 14px;gap:10px}
    .pill{background:#111c33;border:1px solid #1e315f;border-radius:12px;padding:8px 12px;font-size:12px;font-weight:700}
    .pill span{color:#0098EA}
    .page{display:none;padding:14px}
    .page.active{display:block}
    .mine-circle{width:220px;height:220px;margin:26px auto;background:radial-gradient(at 30% 30%,#26407a,#0e1933);border:4px solid #0098EA;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:64px;box-shadow:0 0 50px rgba(0,152,234,.35);cursor:pointer;user-select:none;}
    .mine-circle:active{transform:scale(.92)}
    .balance-big{font-size:36px;color:#0098EA;text-align:center;font-weight:800}
    .sub{opacity:.6;text-align:center;font-size:13px;margin-top:4px}
    .btn{width:100%;background:#0098EA;color:#fff;border:none;border-radius:14px;padding:16px;font-size:16px;font-weight:800;margin-top:14px;cursor:pointer}
    .task{background:#111c33;border:1px solid #1e315f;border-radius:14px;padding:12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
    .task-left{display:flex;gap:10px;align-items:center}
    .icon{width:36px;height:36px;background:#0d1730;border-radius:10px;display:flex;align-items:center;justify-content:center}
    .t-title{font-size:13px;font-weight:700}
    .t-sub{font-size:11px;color:#0098EA;margin-top:2px}
    .t-btn{background:#0098EA;color:#fff;border:none;border-radius:20px;padding:7px 14px;font-size:11px;font-weight:800}
    .wallet-card{background:linear-gradient(135deg,#0098EA,#48c0ff);border-radius:22px;padding:20px;text-align:center}
    .ref-box{background:#111c33;border:1px solid #1e315f;border-radius:16px;padding:16px;text-align:center}
    .ref-link{background:#0a1226;border:1px dashed #23406f;border-radius:10px;padding:10px;font-size:11px;color:#6aa8ff;word-break:break-all;margin:10px 0}
    .nav{position:fixed;bottom:0;left:0;right:0;background:#0e1933;border-top:1px solid #1e315f;display:flex;justify-content:space-around;padding:8px 0}
    .nav-item{text-align:center;font-size:10px;color:#5f7294;flex:1}
    .nav-item.active{color:#0098EA}
    .nav-item b{font-size:20px;display:block}
  </style>
</head>
<body>
<div class="top">
  <div class="pill">💎 <span id="unclaimed">0.00</span> TON</div>
  <div class="pill">⛏️ <span id="minesLeft">10/10</span> left</div>
</div>

<div id="minePage" class="page active">
  <div class="mine-circle" id="mineBtn">🪨</div>
  <div class="balance-big" id="minePower">0.10 TON</div>
  <div class="sub">Tap to mine</div>
  <div id="balance" class="balance-big" style="font-size:28px;margin-top:18px">$0.00</div>
  <button class="btn" id="claimBtn">Claim to Wallet</button>
</div>

<div id="taskPage" class="page">
  <h3 style="margin-bottom:12px">Tasks - Earn TON</h3>
  <div class="task"><div class="task-left"><div class="icon">📢</div><div><div class="t-title">Follow our channel</div><div class="t-sub">+0.05 TON</div></div></div><button class="t-btn" id="follow1">Go</button></div>
  <div class="task"><div class="task-left"><div class="icon">💎</div><div><div class="t-title">Follow Ton Mine channel</div><div class="t-sub">+0.05 TON</div></div></div><button class="t-btn" id="follow2">Go</button></div>
  <div class="task"><div class="task-left"><div class="icon">🎥</div><div><div class="t-title">Watch ads to refill mines</div><div class="t-sub" id="refillTxt">0/20 today</div></div></div><button class="t-btn" id="refillBtn">Watch</button></div>
  <div class="task"><div class="task-left"><div class="icon">💰</div><div><div class="t-title">Bonus ads to receive TON</div><div class="t-sub" id="bonusTxt">0/100 - $0.05</div></div></div><button class="t-btn" id="watchBtn">Watch</button></div>
</div>

<div id="walletPage" class="page">
  <div class="wallet-card"><div>WALLET</div><h1 id="walletBal">$0.00</h1><div id="walletTon">0.00 TON</div></div>
  <button class="btn" style="background:#fff;color:#0098EA" id="depositBtn">Deposit $2 - Boost to 0.15 TON</button>
  <button class="btn" style="background:#1a2747" id="withdrawBtn">Withdraw Min $20</button>
</div>

<div id="referPage" class="page">
  <div class="ref-box"><div style="font-size:40px">👥</div><h3>Invite</h3><div class="ref-link" id="refLink">link</div><button class="btn" id="copyBtn">Copy Link</button></div>
</div>

<div class="nav">
  <div class="nav-item active" onclick="showPage('minePage',this)"><b>⛏️</b>Mine</div>
  <div class="nav-item" onclick="showPage('taskPage',this)"><b>📋</b>Task</div>
  <div class="nav-item" onclick="showPage('walletPage',this)"><b>👛</b>Wallet</div>
  <div class="nav-item" onclick="showPage('referPage',this)"><b>👥</b>Refer</div>
</div>

<script>
let tg; try{ tg=window.Telegram.WebApp; tg.expand(); }catch(e){ tg={showAlert:(m)=>alert(m), openLink:(u)=>window.open(u), HapticFeedback:{impactOccurred:()=>{}}}; }
const userId = tg.initDataUnsafe?.user?.id || "7050695818";
document.getElementById("refLink").innerText=`https://t.me/tonminer123_bot?start=${userId}`;
function getAd(){ try{ if(window.Adsgram) return window.Adsgram.init({ blockId: "int-48357" }); }catch(e){} return null; }
let mines=10, unclaimed=0, power=0.1, wallet=0, refillDone=0, bonusDone=0;
function showPage(id,el){ document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); document.getElementById(id).classList.add('active'); document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active')); if(el) el.classList.add('active'); }
window.showPage=showPage;
function updateUI(){ document.getElementById('minesLeft').innerText=`${mines}/10`; document.getElementById('unclaimed').innerText=unclaimed.toFixed(2); document.getElementById('minePower').innerText=`${power.toFixed(2)} TON`; document.getElementById('refillTxt').innerText=`${refillDone}/20 today`; document.getElementById('bonusTxt').innerText=`${bonusDone}/100 - $0.05`; document.getElementById('balance').innerText="$"+wallet.toFixed(2); document.getElementById('walletBal').innerText="$"+wallet.toFixed(2); document.getElementById('walletTon').innerText=wallet.toFixed(2)+" TON"; }
function doMine(){ if(mines<=0){ tg.showAlert("No mines! Watch ad in Task"); showPage('taskPage',document.querySelectorAll('.nav-item')[1]); return; } mines--; unclaimed+=power; updateUI(); try{ tg.HapticFeedback.impactOccurred('light'); }catch(e){} }

document.getElementById('mineBtn').onclick=doMine;
document.getElementById('claimBtn').onclick=function(){ if(unclaimed==0) return tg.showAlert("Mine first!"); wallet+=unclaimed; unclaimed=0; updateUI(); tg.showAlert("Claimed!"); };
document.getElementById('depositBtn').onclick=function(){ power=0.15; updateUI(); tg.showAlert("Boosted to 0.15 TON!"); };
document.getElementById('withdrawBtn').onclick=function(){ if(wallet<20) return tg.showAlert("Min $20 needed. You have $"+wallet.toFixed(2)); tg.showAlert("Withdraw $"+wallet.toFixed(2)+" requested!"); };
document.getElementById('copyBtn').onclick=function(){ navigator.clipboard.writeText(document.getElementById('refLink').innerText); tg.showAlert("Copied!"); };
document.getElementById('follow1').onclick=function(){ tg.openLink('https://t.me/tonminer_bot1?start=7050695818'); wallet+=0.05; updateUI(); tg.showAlert("+0.05 TON!"); this.innerText="Done"; };
document.getElementById('follow2').onclick=function(){ tg.openLink('https://t.me/toncoin'); wallet+=0.05; updateUI(); tg.showAlert("+0.05 TON!"); this.innerText="Done"; };

document.getElementById('refillBtn').onclick=async function(){ let btn=this, txt=btn.innerText; btn.innerText="Loading..."; btn.disabled=true; try{ let ad=getAd(); if(!ad){ tg.showAlert("Ads loading, try again"); return; } let r=await ad.show(); if(r&&r.done){ mines=Math.min(10,mines+1); refillDone++; updateUI(); tg.showAlert("+1 Mine!"); } }catch(e){ tg.showAlert("No ad now, try later"); } finally{ btn.innerText=txt; btn.disabled=false; } };
document.getElementById('watchBtn').onclick=async function(){ let btn=this, txt=btn.innerText; btn.innerText="Loading..."; btn.disabled=true; try{ let ad=getAd(); if(!ad){ tg.showAlert("Ads loading, try again"); return; } let r=await ad.show(); if(r&&r.done){ bonusDone++; wallet+=0.05; updateUI(); tg.showAlert("+$0.05!"); } }catch(e){ tg.showAlert("No ad now, try later"); } finally{ btn.innerText=txt; btn.disabled=false; } };

updateUI();
</script>
</body>
</html>

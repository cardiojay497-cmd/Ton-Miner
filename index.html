<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cardio Rewards</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
  <style>
    body { background:#000; color:#fff; font-family:sans-serif; text-align:center; padding:20px; }
    button { background:#00ff88; color:#000; padding:15px 30px; border:none; border-radius:12px; font-size:18px; font-weight:bold; cursor:pointer; margin-top:20px; }
    button:disabled { background:#444; color:#888; }
    #balance { font-size:32px; margin:20px 0; color:#00ff88; }
  </style>
</head>
<body>
  <h2>💰 Watch & Earn</h2>
  <div id="balance">$0.00</div>
  <p>Watch ad to earn $0.05</p>
  
  <button id="watchBtn" onclick="watchAd()">▶️ Watch Ad</button>
  <p id="status"></p>

<script>
  const tg = window.Telegram.WebApp;
  tg.expand();
  
  const userId = tg.initDataUnsafe?.user?.id || "test_user";
  document.getElementById("status").innerText = "User: " + userId;

  // Initialize Adsgram with your Block ID 48303
  const AdController = window.Adsgram.init({ blockId: "48303" });

  async function watchAd() {
    const btn = document.getElementById("watchBtn");
    btn.disabled = true;
    btn.innerText = "Loading ad...";
    
    try {
      const result = await AdController.show();
      
      if (result.done) {
        document.getElementById("status").innerText = "✅ Ad watched! Adding $0.05...";
        
        // Adsgram go automatically call your reward URL for backend:
        // https://cardio-backend.vercel.app/api/adsgram-reward?userId=[userId]
        // But we go also confirm for frontend
        setTimeout(() => {
          document.getElementById("status").innerText = "🎉 $0.05 added! Refresh to see balance.";
          btn.disabled = false;
          btn.innerText = "▶️ Watch Another Ad";
        }, 2000);
        
      } else {
        document.getElementById("status").innerText = "❌ You no finish the ad";
        btn.disabled = false;
        btn.innerText = "▶️ Try Again";
      }
    } catch (e) {
      document.getElementById("status").innerText = "Error: " + JSON.stringify(e);
      btn.disabled = false;
      btn.innerText = "▶️ Watch Ad";
    }
  }

  // Load balance from Supabase via your backend
  async function loadBalance() {
    try {
      const res = await fetch(`https://cardio-backend.vercel.app/api/get-balance?userId=${userId}`);
      const data = await res.json();
      if(data.balance !== undefined) {
        document.getElementById("balance").innerText = "$" + data.balance.toFixed(2);
      }
    } catch(e) {}
  }
  
  loadBalance();
</script>
</body>
</html>
